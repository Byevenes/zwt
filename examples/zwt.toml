version = 1
worktrees_dir = "worktrees"
scratch_dir = ".scratch"

[identity.personal]
name = "Jane Doe"
email = "jane@example.com"

[identity.work]
name = "Jane Doe"
email = "jane.doe@example.com"

[identity.external]
name = "Jane Doe"
email = "jane.external@example.com"

[[profile]]
match = "~/personal/**"
identity = "personal"
base_branch = "main"

[[profile]]
match = "~/work/acme/**"
identity = "work"
base_branch = "develop"
branch_prefix = "feature/"
expect_remote = "gitlab.com:acme/"
guards = ["pre-commit", "pre-push"]

# pattern is a case-sensitive substring of the origin URL, not a glob.
# `github.com/other-org/` matches https://github.com/other-org/app.git
# and not git@github.com:other-org/app.git. The longest match wins.
[[remote]]
pattern = "github.com/other-org/"
identity = "external"

[[project]]
path = "~/work/acme/backend/api"
base_branch = "main"
email = "jane.ext@example.com"
