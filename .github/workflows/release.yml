name: release

# A tag push publishes the GitHub Release. workflow_dispatch builds artifacts only.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: check tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/release.sh check-tag
      - run: bash scripts/release.sh build dist/release
      - run: bash scripts/release.sh checksums dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: zwt-release
          path: dist/release
      - name: publish
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh publish dist/release
