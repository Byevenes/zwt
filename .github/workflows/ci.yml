name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: smoke
        run: |
          ./dist/zwt --version
          ./dist/zwt config check --config examples/zwt.toml
          if ./dist/zwt config check --config test/fixtures/invalid.toml; then exit 1; fi
          bash scripts/smoke-new.sh dist/zwt

  commit-emails:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash scripts/check-commit-emails.sh "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
